<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed - DevConnect</title>
    <meta name="description" content="DevConnect Home Feed">
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body class="app-body">
    <nav class="navbar">
        <div class="nav-container">
            <a href="/home" class="logo">DevConnect</a>
            <div class="nav-links">
                <a href="/home">Home</a>
                <a href="/feed" class="active">Feed</a>
                <a href="/search">Search</a>
                <a href="/profile" id="navProfile">Profile</a>
                <button id="logoutBtn" class="btn btn-outline">Logout</button>
            </div>
        </div>
    </nav>

    <main class="container">
        <div class="create-post glassmorphism">
            <form id="createPostForm">
                <textarea id="postContent" placeholder="What's on your mind, developer?" required></textarea>
                <div class="post-actions">
                    <label class="file-upload btn btn-outline">
                        <input type="file" id="postMedia" accept="image/*,video/*">
                        Upload Media
                    </label>
                    <button type="submit" class="btn btn-primary">Post</button>
                </div>
            </form>
        </div>

        <div id="feedContainer" class="feed-container">
            <!-- Posts will be loaded here -->
        </div>
    </main>

    <script src="/js/main.js"></script>
    <script>
        checkAuth();

        document.getElementById('logoutBtn').addEventListener('click', logout);

        document.getElementById('createPostForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const content = document.getElementById('postContent').value;
            const mediaFile = document.getElementById('postMedia').files[0];

            const formData = new FormData();
            formData.append('content', content);
            if (mediaFile) {
                formData.append('media', mediaFile);
            }

            try {
                const token = localStorage.getItem('token');
                const res = await fetch('/api/posts', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    },
                    body: formData
                });
                
                if (!res.ok) throw new Error('Failed to create post');
                
                document.getElementById('postContent').value = '';
                document.getElementById('postMedia').value = '';
                loadFeed();
            } catch (err) {
                console.error(err);
                alert('Error creating post');
            }
        });

        async function loadFeed() {
            try {
                const posts = await apiCall('/api/posts');
                const feedContainer = document.getElementById('feedContainer');
                feedContainer.innerHTML = '';
                
                const currentUserId = localStorage.getItem('userId');

                posts.forEach(post => {
                    const isLiked = post.likes.includes(currentUserId);
                    const likeClass = isLiked ? 'liked' : '';
                    
                    const postEl = document.createElement('div');
                    postEl.className = 'post-card glassmorphism fade-in';
                    postEl.innerHTML = `
                        <div class="post-header">
                            <img src="${post.userId.profilePic || '/images/default-avatar.svg'}" alt="Profile" class="avatar">
                            <div class="post-info">
                                <a href="/profile?id=${post.userId._id}" class="post-author">${post.userId.username}</a>
                                <span class="post-date">${new Date(post.createdAt).toLocaleDateString()}</span>
                            </div>
                            ${post.userId._id === currentUserId ? `<button class="btn-delete" onclick="deletePost('${post._id}')">✕</button>` : ''}
                        </div>
                        <div class="post-content">
                            <p>${post.content}</p>
                            ${post.image ? `<img src="${post.image}" alt="Post image" class="post-image">` : ''}
                            ${post.video ? `<video src="${post.video}" controls class="post-video" style="width:100%; border-radius:8px; margin-bottom:15px;"></video>` : ''}
                        </div>
                        <div class="post-footer">
                            <button class="btn-like ${likeClass}" onclick="likePost('${post._id}')">
                                ♥ <span id="likeCount-${post._id}">${post.likes.length}</span>
                            </button>
                        </div>
                        <div class="comments-section" style="margin-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px;">
                            <div class="comments-list" style="margin-bottom: 10px; max-height: 200px; overflow-y: auto;">
                                ${post.comments.map(c => `
                                    <div class="comment" style="margin-bottom: 8px; font-size: 14px; background: rgba(0,0,0,0.2); padding: 8px; border-radius: 6px;">
                                        <strong>${c.userId.username}</strong>: <span style="color: var(--text-muted);">${c.text}</span>
                                    </div>
                                `).join('')}
                            </div>
                            <form onsubmit="addComment(event, '${post._id}')" style="display: flex; gap: 10px;">
                                <input type="text" id="commentInput-${post._id}" placeholder="Add a comment..." required style="flex-grow: 1; padding: 8px; border-radius: 6px; background: rgba(13,17,23,0.8); border: 1px solid var(--border-color); color: var(--text-main);">
                                <button type="submit" class="btn btn-primary btn-sm">Post</button>
                            </form>
                        </div>
                    `;
                    feedContainer.appendChild(postEl);
                });
            } catch (error) {
                console.error('Error loading feed:', error);
            }
        }

        async function likePost(postId) {
            try {
                const res = await apiCall(`/api/posts/${postId}/like`, 'POST');
                loadFeed();
            } catch (error) {
                console.error('Error liking post:', error);
            }
        }

        async function deletePost(postId) {
            if(confirm('Are you sure you want to delete this post?')) {
                try {
                    await apiCall(`/api/posts/${postId}`, 'DELETE');
                    loadFeed();
                } catch (error) {
                    console.error('Error deleting post:', error);
                }
            }
        }

        async function addComment(e, postId) {
            e.preventDefault();
            const input = document.getElementById(`commentInput-${postId}`);
            const text = input.value;
            
            try {
                await apiCall(`/api/posts/${postId}/comment`, 'POST', { text });
                loadFeed();
            } catch (error) {
                console.error('Error adding comment:', error);
            }
        }

        loadFeed();
    </script>
</body>
</html>
