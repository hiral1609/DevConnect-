<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DevConnect</title>
    <meta name="description" content="Login to DevConnect - The developer networking platform">
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
    <div class="auth-container glassmorphism">
        <div class="auth-header">
            <h1>DevConnect</h1>
            <p>Connect with developers worldwide</p>
        </div>
        <form id="loginForm" class="auth-form">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required placeholder="developer@example.com">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Login</button>
            <p id="errorMessage" class="error-text"></p>
        </form>
        <div class="auth-footer">
            <p>Don't have an account? <a href="/register">Sign up</a></p>
        </div>
    </div>
    <script src="/js/main.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMessage');

            try {
                const res = await apiCall('/api/auth/login', 'POST', { email, password });
                localStorage.setItem('token', res.token);
                localStorage.setItem('userId', res._id);
                localStorage.setItem('username', res.username);
                window.location.href = '/home';
            } catch (err) {
                errorMsg.textContent = err.message || 'Login failed';
            }
        });
    </script>
</body>
</html>
