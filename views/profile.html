<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - DevConnect</title>
    <meta name="description" content="DevConnect User Profile">
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="app-body">
    <nav class="navbar">
        <div class="nav-container">
            <a href="/home" class="logo">DevConnect</a>
            <div class="nav-links">
                <a href="/home">Home</a>
                <a href="/feed">Feed</a>
                <a href="/search">Search</a>
                <a href="/profile" class="active">Profile</a>
                <button id="logoutBtn" class="btn btn-outline">Logout</button>
            </div>
        </div>
    </nav>

    <main class="container">
        <div class="profile-card glassmorphism fade-in">
            <div id="profileContent">
                <!-- Profile data will load here -->
                <div class="loader">Loading...</div>
            </div>
        </div>

        <h3 style="margin-top: 30px; margin-bottom: 20px;">Posts</h3>
        <div id="userPostsContainer" class="feed-container">
            <!-- User posts will load here -->
        </div>
    </main>

    <!-- Edit Profile Modal -->
    <div id="editProfileModal" class="modal">
        <div class="modal-content glassmorphism">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2>Edit Profile</h2>
            <form id="editProfileForm">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="editUsername">
                </div>
                <div class="form-group">
                    <label>Bio</label>
                    <textarea id="editBio"></textarea>
                </div>
                <div class="form-group">
                    <label>Skills (comma separated)</label>
                    <input type="text" id="editSkills">
                </div>
                <div class="form-group">
                    <label>Profile Picture</label>
                    <input type="file" id="editPic" accept="image/*">
                </div>
                <button type="submit" class="btn btn-primary">Save Changes</button>
            </form>
        </div>
    </div>

    <script src="/js/main.js"></script>
    <script>
        checkAuth();
        document.getElementById('logoutBtn').addEventListener('click', logout);

        const currentUserId = localStorage.getItem('userId');
        const urlParams = new URLSearchParams(window.location.search);
        const profileId = urlParams.get('id') || currentUserId;
        const isOwnProfile = profileId === currentUserId;

        async function loadProfile() {
            try {
                const user = await apiCall(`/api/users/profile/${profileId}`);
                const profileContent = document.getElementById('profileContent');
                
                const isFollowing = user.followers.some(f => f._id === currentUserId);

                profileContent.innerHTML = `
                    <div class="profile-header-main">
                        <img src="${user.profilePic || '/images/default-avatar.svg'}" alt="Profile" class="profile-avatar">
                        <div class="profile-details">
                            <h2>${user.username}</h2>
                            <p class="bio">${user.bio || 'No bio available'}</p>
                            <div class="stats">
                                <span><strong>${user.followers.length}</strong> Followers</span>
                                <span><strong>${user.following.length}</strong> Following</span>
                            </div>
                            <div class="skills-list">
                                ${user.skills.map(skill => `<span class="skill-tag">${skill}</span>`).join('')}
                            </div>
                        </div>
                    </div>
                    <div class="profile-actions">
                        ${isOwnProfile ? 
                            `<button class="btn btn-outline" onclick="openModal()">Edit Profile</button>
                             <button class="btn btn-primary" style="margin-left: 10px; background: var(--danger); border: none;" onclick="deleteAccount()">Delete Account</button>` : 
                            `<button class="btn ${isFollowing ? 'btn-outline' : 'btn-primary'}" onclick="toggleFollow('${user._id}')">
                                ${isFollowing ? 'Unfollow' : 'Follow'}
                            </button>`
                        }
                    </div>
                `;

                if (isOwnProfile) {
                    document.getElementById('editUsername').value = user.username;
                    document.getElementById('editBio').value = user.bio || '';
                    document.getElementById('editSkills').value = user.skills.join(', ');
                }
            } catch (error) {
                console.error('Error loading profile:', error);
                document.getElementById('profileContent').innerHTML = '<p>Error loading profile</p>';
            }
        }

        async function toggleFollow(id) {
            try {
                await apiCall(`/api/users/${id}/follow`, 'POST');
                loadProfile();
            } catch (error) {
                console.error('Error toggling follow:', error);
            }
        }

        function openModal() {
            document.getElementById('editProfileModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('editProfileModal').style.display = 'none';
        }

        document.getElementById('editProfileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData();
            formData.append('username', document.getElementById('editUsername').value);
            formData.append('bio', document.getElementById('editBio').value);
            formData.append('skills', document.getElementById('editSkills').value);
            
            const picFile = document.getElementById('editPic').files[0];
            if (picFile) {
                formData.append('profilePic', picFile);
            }

            try {
                const token = localStorage.getItem('token');
                const res = await fetch('/api/users/profile', {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    },
                    body: formData
                });
                
                if (!res.ok) throw new Error('Failed to update profile');
                
                closeModal();
                loadProfile();
                loadUserPosts();
            } catch (error) {
                console.error(error);
                alert('Error updating profile');
            }
        });

        async function loadUserPosts() {
            try {
                const posts = await apiCall(`/api/posts/user/${profileId}`);
                const feedContainer = document.getElementById('userPostsContainer');
                feedContainer.innerHTML = '';

                if (posts.length === 0) {
                    feedContainer.innerHTML = '<p class="text-muted" style="text-align: center;">No posts yet.</p>';
                    return;
                }
                
                posts.forEach(post => {
                    const isLiked = post.likes.includes(currentUserId);
                    const likeClass = isLiked ? 'liked' : '';
                    
                    const postEl = document.createElement('div');
                    postEl.className = 'post-card glassmorphism fade-in';
                    postEl.innerHTML = `
                        <div class="post-header">
                            <img src="${post.userId.profilePic || '/images/default-avatar.svg'}" alt="Profile" class="avatar">
                            <div class="post-info">
                                <a href="/profile?id=${post.userId._id}" class="post-author">${post.userId.username}</a>
                                <span class="post-date">${new Date(post.createdAt).toLocaleDateString()}</span>
                            </div>
                            ${post.userId._id === currentUserId ? `<button class="btn-delete" onclick="deletePost('${post._id}')">✕</button>` : ''}
                        </div>
                        <div class="post-content">
                            <p>${post.content}</p>
                            ${post.image ? `<img src="${post.image}" alt="Post image" class="post-image">` : ''}
                            ${post.video ? `<video src="${post.video}" controls class="post-video" style="width:100%; border-radius:8px; margin-bottom:15px;"></video>` : ''}
                        </div>
                        <div class="post-footer">
                            <button class="btn-like ${likeClass}" onclick="likePost('${post._id}')">
                                ♥ <span id="likeCount-${post._id}">${post.likes.length}</span>
                            </button>
                        </div>
                        <div class="comments-section" style="margin-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px;">
                            <div class="comments-list" style="margin-bottom: 10px; max-height: 200px; overflow-y: auto;">
                                ${post.comments.map(c => `
                                    <div class="comment" style="margin-bottom: 8px; font-size: 14px; background: rgba(0,0,0,0.2); padding: 8px; border-radius: 6px;">
                                        <strong>${c.userId.username}</strong>: <span style="color: var(--text-muted);">${c.text}</span>
                                    </div>
                                `).join('')}
                            </div>
                            <form onsubmit="addComment(event, '${post._id}')" style="display: flex; gap: 10px;">
                                <input type="text" id="commentInput-${post._id}" placeholder="Add a comment..." required style="flex-grow: 1; padding: 8px; border-radius: 6px; background: rgba(13,17,23,0.8); border: 1px solid var(--border-color); color: var(--text-main);">
                                <button type="submit" class="btn btn-primary btn-sm">Post</button>
                            </form>
                        </div>
                    `;
                    feedContainer.appendChild(postEl);
                });
            } catch (error) {
                console.error('Error loading user posts:', error);
            }
        }

        async function likePost(postId) {
            try {
                await apiCall(`/api/posts/${postId}/like`, 'POST');
                loadUserPosts();
            } catch (error) {
                console.error('Error liking post:', error);
            }
        }

        async function deletePost(postId) {
            if(confirm('Are you sure you want to delete this post?')) {
                try {
                    await apiCall(`/api/posts/${postId}`, 'DELETE');
                    loadUserPosts();
                } catch (error) {
                    console.error('Error deleting post:', error);
                }
            }
        }

        async function addComment(e, postId) {
            e.preventDefault();
            const input = document.getElementById(`commentInput-${postId}`);
            const text = input.value;
            
            try {
                await apiCall(`/api/posts/${postId}/comment`, 'POST', { text });
                loadUserPosts();
            } catch (error) {
                console.error('Error adding comment:', error);
            }
        }

        async function deleteAccount() {
            if(confirm('Are you absolutely sure you want to delete your account? This will permanently delete your profile and all your posts.')) {
                try {
                    await apiCall('/api/users/profile', 'DELETE');
                    logout();
                } catch (error) {
                    console.error('Error deleting account:', error);
                    alert('Error deleting account');
                }
            }
        }

        loadProfile();
        loadUserPosts();
    </script>
</body>
</html>
